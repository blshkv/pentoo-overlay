name: Pentoo Visibility Check

on:
  schedule:
    - cron: "6 * * * *"
  pull_request:
    branches:
      - master

jobs:
  pentoo-visibility-check:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    -
      name: Check branch is in sync with master
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin master
        BEHIND=$(git rev-list "${{ github.event.pull_request.head.sha }}"..origin/master --count)
        if [ "$BEHIND" -gt 0 ]; then
          echo "::error::Branch is $BEHIND commit(s) behind master. Please rebase before running CI."
          exit 1
        fi
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: List added files
      run: git diff-tree --no-commit-id --name-only -r ${{ github.sha }}
    -
      name: Visibility Check
      run: |
        sudo docker build --progress=plain . -f scripts/qa/Dockerfile.visibility
